; PlatformIO Configuration for HoneyChain ESP32 Firmware
; Board: ESP32 DevKit V1 (or similar)
; Framework: Arduino

[platformio]
src_dir = honeychain_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    ; HX711 — uncomment if you have a load cell:
    ; bogdanH/ESP32 HX711@^1.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_EVENT_RUNNING_CORE=1
